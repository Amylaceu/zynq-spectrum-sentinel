# X1 proposed hardware contract. Not implemented by accepted sentinel_v1.
name: cfar_x1
base: 0x43C20000
width: 32
address_width: 14
regs:
  - {name: CTRL, off: 0x00, reset: 0}
  - {name: N_SHIFT, off: 0x04, reset: 4}
  - {name: GUARD, off: 0x08, reset: 2}
  - {name: ALPHA, off: 0x0C, reset: 1974}
  - {name: DC_MASK, off: 0x10, reset: 3}
  - {name: MERGE_GAP, off: 0x14, reset: 6}
  - {name: TARGET_COUNT, off: 0x18, access: ro}
  - {name: FRAME_COUNT, off: 0x1C, access: ro}
  - {name: HIT_COUNT, off: 0x20, access: ro}
  - {name: ALARM_LIMIT, off: 0x24, reset: 1}
  - {name: ALARM, off: 0x28, access: ro}
  - {name: OCC_CLEAR_TOKEN, off: 0x2C, reset: 0}
  - {name: OCC_FRAMES, off: 0x30, access: ro}
  - {name: STATUS, off: 0x34, access: ro}
  - {name: MIN_WIDTH, off: 0x38, reset: 2}
  - {name: MASK_COUNT, off: 0x3C, reset: 0}
  - {name: STATUS_LATCH, off: 0x40, access: ro}
  - {name: RAW_COUNT, off: 0x44, access: ro}
  - {name: FILTERED_COUNT, off: 0x48, access: ro}
  - {name: CANDIDATE_COUNT, off: 0x4C, access: ro}
  - {name: VERSION, off: 0xFC, access: ro, reset: 0x43460002}
windows:
  - {name: MASK, off: 0x80, bytes: 64, record_bytes: 4, access: rw}
  - {name: TARGETS, off: 0x200, bytes: 512, record_bytes: 16, access: ro}
  - {name: OCCUPANCY, off: 0x1000, bytes: 8192, record_bytes: 4, access: ro}
